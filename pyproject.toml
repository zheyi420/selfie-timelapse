[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selfie-timelapse"
version = "0.1.0"
description = "Generate face-aligned timelapse videos from selfie photos"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "zheyi420"}
]
keywords = ["selfie", "timelapse", "face-alignment", "video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "mediapipe>=0.10.0",
    "opencv-python>=4.8.0",
    "imageio[ffmpeg]>=2.31.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
]

[project.scripts]
selfie-timelapse = "selfie_timelapse.cli:main"

[tool.setuptools.packages.find]
include = ["selfie_timelapse*"]

[project.urls]
Homepage = "https://github.com/zheyi420/selfie-timelapse"
Repository = "https://github.com/zheyi420/selfie-timelapse"
Issues = "https://github.com/zheyi420/selfie-timelapse/issues"
